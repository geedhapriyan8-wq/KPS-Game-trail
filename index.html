<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>KPS Project</title>
		<link rel="icon" type="image/png" href="/assets/kps/favicon.png" />
		<meta name="theme-color" content="#e6c9ff" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Nunito is the brand typeface named in css/styles.css. Without this
		     link the CSS silently falls back to Segoe UI / system sans, which is
		     why the app previously looked generic. Keep it on every page. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/styles.css" />
	</head>
	<body>
		<section class="screen">
			<div class="kps-card">
				<img src="/assets/kps/kps_logo.svg" alt="Kids PlaySafer" class="kps-card-logo" />
				<h1 class="kps-card-title">Enter Passcode</h1>
				<form id="passcode-form" class="kps-form">
					<input
						id="passcode-input"
						type="password"
						class="kps-input"
						placeholder="Passcode"
						autocomplete="current-password"
						required
					/>
					<p id="passcode-error" class="kps-error" hidden></p>
					<button type="submit" class="kps-btn kps-btn-primary">Play Game</button>
				</form>
				<p id="completion-count" class="kps-count-badge">&nbsp;</p>
			</div>
		</section>
		<script type="module" src="/js/pages/index.js"></script>
	</body>
</html>
