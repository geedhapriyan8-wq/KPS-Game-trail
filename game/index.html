<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>KPS Game</title>
		<link rel="icon" type="image/png" href="/assets/kps/favicon.png" />
		<link rel="stylesheet" href="/css/styles.css" />
	</head>
	<body>
		<section class="screen screen-game">
			<header class="game-header">
				<img src="/assets/kps/kps_logo.png" alt="Kids PlaySafer" class="game-header-logo" />
				<button type="button" id="game-signout" class="kps-link">Sign out</button>
			</header>
			<main class="game-area">
				<!-- ════════════════════════════════════════════════════════
				     DEVELOPER: quiz UI. Question content lives in
				     js/pages/game/questions.js — add more scenarios there,
				     nothing here needs to change.
				     ════════════════════════════════════════════════════════ -->
				<div id="quiz-screen" class="kps-card kps-quiz-card">
					<p id="quiz-progress" class="kps-info"></p>
					<h1 id="quiz-scenario" class="kps-card-title"></h1>
					<div id="quiz-options" class="kps-quiz-options"></div>
					<p id="quiz-feedback" class="kps-info" hidden></p>
					<button type="button" id="quiz-next" class="kps-btn kps-btn-primary" hidden>Next</button>
				</div>

				<div id="quiz-result" class="kps-card kps-quiz-card" hidden>
					<h1 class="kps-card-title">Nice work!</h1>
					<p id="quiz-score" class="kps-card-subtitle"></p>
					<p id="game-status" class="kps-info" hidden></p>
					<div id="survey-mount"></div>
				</div>
				<!-- ════════════════════════════════════════════════════════
				     End of developer area
				     ════════════════════════════════════════════════════════ -->
			</main>
		</section>

		<!-- Survey form template (cloned into #survey-mount when the player completes) -->
		<template id="survey-template">
			<form class="kps-form kps-survey" data-survey-form>
				<h2 class="kps-card-subtitle">Quick survey</h2>
				<label class="kps-field">
					<span>How did you find the activity?</span>
					<select name="difficulty" class="kps-input" required>
						<option value="">Choose one...</option>
						<option value="easy">Easy</option>
						<option value="just_right">Just right</option>
						<option value="hard">Hard</option>
					</select>
				</label>
				<label class="kps-field">
					<span>One thing you learned (optional)</span>
					<input name="learning" type="text" class="kps-input" placeholder="Type your answer..." />
				</label>
				<button type="submit" class="kps-btn kps-btn-primary">Submit</button>
				<p class="kps-info" data-survey-status hidden></p>
			</form>
		</template>

		<script type="module" src="/js/pages/game/index.js"></script>
	</body>
</html>
