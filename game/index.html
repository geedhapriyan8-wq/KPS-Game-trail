<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>KPS Game</title>
		<link rel="icon" type="image/png" href="/assets/kps/favicon.png" />
		<meta name="theme-color" content="#e6c9ff" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Nunito is the brand typeface named in css/styles.css. Without this
		     link the CSS silently falls back to Segoe UI / system sans, which is
		     why the app previously looked generic. Keep it on every page. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/styles.css" />
	</head>
	<body>
		<section class="screen screen-game">
			<header class="game-header">
				<img src="/assets/kps/kps_logo.svg" alt="Kids PlaySafer" class="game-header-logo" />
				<button type="button" id="game-signout" class="kps-link">Sign out</button>
			</header>
			<main class="game-area">
				<!-- ════════════════════════════════════════════════════════
				     DEVELOPER: quiz UI. Question content lives in
				     js/pages/game/questions.js — add more scenarios there,
				     nothing here needs to change.
				     ════════════════════════════════════════════════════════ -->
				<div id="quiz-screen" class="kps-card kps-quiz-card">
					<div class="kps-quiz-meta">
						<!-- Deliberately NOT the scam category: naming it here would
						     tell the player what to look for. The category is
						     revealed in the feedback panel after they answer. -->
						<span class="kps-quiz-prompt">Spot the scam</span>
						<span id="quiz-counter" class="kps-quiz-counter"></span>
					</div>
					<div class="kps-progress-track" role="progressbar" aria-label="Quiz progress">
						<div id="quiz-progress-fill" class="kps-progress-fill"></div>
					</div>
					<h1 id="quiz-scenario" class="kps-card-title"></h1>
					<div id="quiz-options" class="kps-quiz-options"></div>
					<p id="quiz-feedback" class="kps-quiz-feedback" role="status" aria-live="polite" hidden></p>
					<button type="button" id="quiz-next" class="kps-btn kps-btn-primary" hidden>Next</button>
				</div>

				<div id="quiz-result" class="kps-card kps-quiz-card" hidden>
					<h1 id="quiz-result-title" class="kps-card-title">Nice work!</h1>
					<div class="kps-score-hero">
						<span id="quiz-score-value" class="kps-score-value"></span>
						<span id="quiz-score-label" class="kps-score-label"></span>
					</div>
					<!-- Per-category results are rendered here by game/index.js so
					     players see which scam types they should brush up on. -->
					<div id="quiz-breakdown" class="kps-breakdown"></div>
					<p id="game-status" class="kps-info" hidden></p>
					<div id="survey-mount"></div>
				</div>
				<!-- ════════════════════════════════════════════════════════
				     End of developer area
				     ════════════════════════════════════════════════════════ -->
			</main>
		</section>

		<!-- Survey form template (cloned into #survey-mount when the player completes) -->
		<template id="survey-template">
			<form class="kps-form kps-survey" data-survey-form>
				<h2 class="kps-card-subtitle">Quick survey</h2>

				<fieldset class="kps-field">
					<legend>Before playing, how confident were you in spotting a scam?</legend>
					<div class="kps-scale" role="radiogroup" aria-label="Confidence before playing, 1 to 5">
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="1" required /><span>1</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="2" /><span>2</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="3" /><span>3</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="4" /><span>4</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="5" /><span>5</span></label>
					</div>
					<div class="kps-scale-labels"><span>Not confident</span><span>Very confident</span></div>
				</fieldset>

				<fieldset class="kps-field">
					<legend>After playing, how confident do you feel now?</legend>
					<div class="kps-scale" role="radiogroup" aria-label="Confidence after playing, 1 to 5">
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="1" required /><span>1</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="2" /><span>2</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="3" /><span>3</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="4" /><span>4</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="5" /><span>5</span></label>
					</div>
					<div class="kps-scale-labels"><span>Not confident</span><span>Very confident</span></div>
				</fieldset>

				<fieldset class="kps-field">
					<legend>Do you feel more aware of common scam warning signs now?</legend>
					<div class="kps-pill-group" role="radiogroup" aria-label="Feels more aware of scam warning signs">
						<label class="kps-pill-option"><input type="radio" name="feelsMoreAware" value="yes" required /><span>Yes</span></label>
						<label class="kps-pill-option"><input type="radio" name="feelsMoreAware" value="somewhat" /><span>Somewhat</span></label>
						<label class="kps-pill-option"><input type="radio" name="feelsMoreAware" value="no" /><span>Not really</span></label>
					</div>
				</fieldset>

				<label class="kps-field">
					<span>Which scam worries you most in real life?</span>
					<select name="mostWorryingScam" class="kps-input" data-category-select required>
						<option value="">Choose one...</option>
					</select>
				</label>

				<label class="kps-field">
					<span>How did you find the activity?</span>
					<select name="difficulty" class="kps-input" required>
						<option value="">Choose one...</option>
						<option value="easy">Easy</option>
						<option value="just_right">Just right</option>
						<option value="hard">Hard</option>
					</select>
				</label>

				<fieldset class="kps-field">
					<legend>Would you share what you learned with family or friends?</legend>
					<div class="kps-pill-group" role="radiogroup" aria-label="Would share what they learned">
						<label class="kps-pill-option"><input type="radio" name="wouldShare" value="yes" required /><span>Yes</span></label>
						<label class="kps-pill-option"><input type="radio" name="wouldShare" value="maybe" /><span>Maybe</span></label>
						<label class="kps-pill-option"><input type="radio" name="wouldShare" value="no" /><span>No</span></label>
					</div>
				</fieldset>

				<label class="kps-field">
					<span>One thing you learned (optional)</span>
					<input name="learning" type="text" class="kps-input" placeholder="Type your answer..." />
				</label>

				<button type="submit" class="kps-btn kps-btn-primary">Submit</button>
				<p class="kps-info" data-survey-status hidden></p>
			</form>
		</template>

		<script type="module" src="/js/pages/game/index.js"></script>
	</body>
</html>
