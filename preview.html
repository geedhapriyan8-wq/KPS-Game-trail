<!doctype html>
<!--
  LOCAL VISUAL PREVIEW — not part of the deployed app.

  Renders the real quiz markup, CSS, and question data with Firebase stubbed
  out, so you can check design changes without logging in or writing to
  Firestore. Open /preview.html with the dev server running.

  Add ?screen=result to jump straight to the results + survey view.
  Delete this file before deploying if you'd rather not ship it.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>KPS — Visual Preview</title>
		<meta name="theme-color" content="#e6c9ff" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/styles.css" />
	</head>
	<body>
		<section class="screen screen-game">
			<header class="game-header">
				<img src="/assets/kps/kps_logo.svg" alt="Kids PlaySafer" class="game-header-logo" />
				<button type="button" id="game-signout" class="kps-link">Sign out</button>
			</header>
			<main class="game-area">
				<div id="quiz-screen" class="kps-card kps-quiz-card">
					<div class="kps-quiz-meta">
						<span id="quiz-category-badge" class="kps-category-badge"></span>
						<span id="quiz-counter" class="kps-quiz-counter"></span>
					</div>
					<div class="kps-progress-track" role="progressbar" aria-label="Quiz progress">
						<div id="quiz-progress-fill" class="kps-progress-fill"></div>
					</div>
					<h1 id="quiz-scenario" class="kps-card-title"></h1>
					<div id="quiz-options" class="kps-quiz-options"></div>
					<p id="quiz-feedback" class="kps-quiz-feedback" role="status" aria-live="polite" hidden></p>
					<button type="button" id="quiz-next" class="kps-btn kps-btn-primary" hidden>Next</button>
				</div>

				<div id="quiz-result" class="kps-card kps-quiz-card" hidden>
					<h1 id="quiz-result-title" class="kps-card-title">Nice work!</h1>
					<div class="kps-score-hero">
						<span id="quiz-score-value" class="kps-score-value"></span>
						<span id="quiz-score-label" class="kps-score-label"></span>
					</div>
					<div id="quiz-breakdown" class="kps-breakdown"></div>
					<p id="game-status" class="kps-info" hidden></p>
					<div id="survey-mount"></div>
				</div>
			</main>
		</section>

		<template id="survey-template">
			<form class="kps-form kps-survey" data-survey-form>
				<h2 class="kps-card-subtitle">Quick survey</h2>

				<fieldset class="kps-field">
					<legend>Before playing, how confident were you in spotting a scam?</legend>
					<div class="kps-scale" role="radiogroup" aria-label="Confidence before playing, 1 to 5">
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="1" required /><span>1</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="2" /><span>2</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="3" /><span>3</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="4" /><span>4</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceBefore" value="5" /><span>5</span></label>
					</div>
					<div class="kps-scale-labels"><span>Not confident</span><span>Very confident</span></div>
				</fieldset>

				<fieldset class="kps-field">
					<legend>After playing, how confident do you feel now?</legend>
					<div class="kps-scale" role="radiogroup" aria-label="Confidence after playing, 1 to 5">
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="1" required /><span>1</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="2" /><span>2</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="3" /><span>3</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="4" /><span>4</span></label>
						<label class="kps-scale-option"><input type="radio" name="confidenceAfter" value="5" /><span>5</span></label>
					</div>
					<div class="kps-scale-labels"><span>Not confident</span><span>Very confident</span></div>
				</fieldset>

				<fieldset class="kps-field">
					<legend>Do you feel more aware of common scam warning signs now?</legend>
					<div class="kps-pill-group" role="radiogroup" aria-label="Feels more aware of scam warning signs">
						<label class="kps-pill-option"><input type="radio" name="feelsMoreAware" value="yes" required /><span>Yes</span></label>
						<label class="kps-pill-option"><input type="radio" name="feelsMoreAware" value="somewhat" /><span>Somewhat</span></label>
						<label class="kps-pill-option"><input type="radio" name="feelsMoreAware" value="no" /><span>Not really</span></label>
					</div>
				</fieldset>

				<label class="kps-field">
					<span>Which scam worries you most in real life?</span>
					<select name="mostWorryingScam" class="kps-input" data-category-select required>
						<option value="">Choose one...</option>
					</select>
				</label>

				<label class="kps-field">
					<span>How did you find the activity?</span>
					<select name="difficulty" class="kps-input" required>
						<option value="">Choose one...</option>
						<option value="easy">Easy</option>
						<option value="just_right">Just right</option>
						<option value="hard">Hard</option>
					</select>
				</label>

				<fieldset class="kps-field">
					<legend>Would you share what you learned with family or friends?</legend>
					<div class="kps-pill-group" role="radiogroup" aria-label="Would share what they learned">
						<label class="kps-pill-option"><input type="radio" name="wouldShare" value="yes" required /><span>Yes</span></label>
						<label class="kps-pill-option"><input type="radio" name="wouldShare" value="maybe" /><span>Maybe</span></label>
						<label class="kps-pill-option"><input type="radio" name="wouldShare" value="no" /><span>No</span></label>
					</div>
				</fieldset>

				<label class="kps-field">
					<span>One thing you learned (optional)</span>
					<input name="learning" type="text" class="kps-input" placeholder="Type your answer..." />
				</label>

				<button type="submit" class="kps-btn kps-btn-primary">Submit</button>
				<p class="kps-info" data-survey-status hidden></p>
			</form>
		</template>

		<script type="module">
			// Uses the REAL question bank and category definitions.
			import { CATEGORIES, getRandomQuiz } from '/js/pages/game/questions.js';

			const OPTION_KEYS = ['A', 'B', 'C', 'D', 'E', 'F'];
			const questions = getRandomQuiz();
			const q = questions[0];
			const cat = CATEGORIES[q.category];

			// ── Question view ──
			const badge = document.getElementById('quiz-category-badge');
			badge.style.setProperty('--badge-bg', cat.color);
			badge.style.setProperty('--badge-ink', cat.colorDark);
			if (cat.icon) {
				const img = document.createElement('img');
				img.src = cat.icon;
				img.alt = '';
				img.className = 'kps-category-icon';
				badge.appendChild(img);
			} else {
				badge.appendChild(document.createTextNode(cat.emoji));
			}
			badge.appendChild(document.createTextNode(cat.label));

			document.getElementById('quiz-counter').textContent = `Question 1 of ${questions.length}`;
			document.getElementById('quiz-progress-fill').style.width = `${Math.round((1 / questions.length) * 100)}%`;
			document.getElementById('quiz-scenario').textContent = q.scenario;

			const optionsEl = document.getElementById('quiz-options');
			q.options.forEach((text, i) => {
				const btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'kps-quiz-option';
				const key = document.createElement('span');
				key.className = 'kps-quiz-option-key';
				key.textContent = OPTION_KEYS[i];
				const span = document.createElement('span');
				span.className = 'kps-quiz-option-text';
				span.textContent = text;
				btn.append(key, span);
				optionsEl.appendChild(btn);
			});

			// ?answered=1 shows the post-answer revealed state
			if (new URLSearchParams(location.search).has('answered')) {
				const wrong = q.correctIndex === 0 ? 1 : 0;
				[...optionsEl.children].forEach((btn, i) => {
					btn.disabled = true;
					const key = btn.querySelector('.kps-quiz-option-key');
					if (i === q.correctIndex) { btn.classList.add('is-correct'); key.textContent = '✓'; }
					else if (i === wrong) { btn.classList.add('is-incorrect'); key.textContent = '✗'; }
				});
				const fb = document.getElementById('quiz-feedback');
				const strong = document.createElement('strong');
				strong.textContent = 'Not quite. ';
				fb.append(strong, document.createTextNode(q.explanation));
				fb.classList.add('is-incorrect');
				fb.hidden = false;
				const next = document.getElementById('quiz-next');
				next.textContent = 'Next question';
				next.hidden = false;
			}

			// ── Results view ──
			if (new URLSearchParams(location.search).get('screen') === 'result') {
				document.getElementById('quiz-screen').hidden = true;
				const result = document.getElementById('quiz-result');
				result.hidden = false;
				document.getElementById('quiz-result-title').textContent = 'Well spotted!';
				document.getElementById('quiz-score-value').textContent = '8/10';
				document.getElementById('quiz-score-label').textContent = 'scams correctly identified';

				const stats = {
					impersonation: { correct: 2, total: 2 },
					blessing: { correct: 1, total: 2 },
					love: { correct: 2, total: 2 },
					investment: { correct: 1, total: 2 },
					ecommerce: { correct: 2, total: 2 },
				};
				const bd = document.getElementById('quiz-breakdown');
				const h = document.createElement('p');
				h.className = 'kps-breakdown-title';
				h.textContent = 'How you did by scam type';
				bd.appendChild(h);
				Object.entries(stats).forEach(([k, s]) => {
					const c = CATEGORIES[k];
					const row = document.createElement('div');
					row.className = 'kps-breakdown-row';
					const name = document.createElement('span');
					name.className = 'kps-breakdown-name';
					if (c.icon) {
						const im = document.createElement('img');
						im.src = c.icon; im.alt = ''; im.className = 'kps-category-icon';
						name.appendChild(im);
					} else name.appendChild(document.createTextNode(c.emoji + ' '));
					name.appendChild(document.createTextNode(c.label));
					const sc = document.createElement('span');
					sc.className = 'kps-breakdown-score';
					sc.textContent = `${s.correct}/${s.total}`;
					const bar = document.createElement('div');
					bar.className = 'kps-breakdown-bar';
					const fill = document.createElement('div');
					fill.className = 'kps-breakdown-bar-fill';
					fill.style.width = `${(s.correct / s.total) * 100}%`;
					bar.appendChild(fill);
					row.append(name, sc, bar);
					bd.appendChild(row);
				});

				const status = document.getElementById('game-status');
				status.textContent = 'Completion recorded!';
				status.hidden = false;

				// Mount the survey exactly as the real page does
				const mount = document.getElementById('survey-mount');
				mount.appendChild(document.getElementById('survey-template').content.cloneNode(true));
				const sel = mount.querySelector('[data-category-select]');
				Object.entries(CATEGORIES).forEach(([key, c]) => {
					const o = document.createElement('option');
					o.value = key;
					o.textContent = `${c.emoji} ${c.label}`;
					sel.appendChild(o);
				});
			}
		</script>
	</body>
</html>
