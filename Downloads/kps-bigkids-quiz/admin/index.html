<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>KPS Admin Login</title>
		<link rel="icon" type="image/png" href="/assets/kps/favicon.png" />
		<link rel="stylesheet" href="/css/styles.css" />
	</head>
	<body>
		<section class="screen">
			<div class="kps-card">
				<img src="/assets/kps/kps_logo.png" alt="Kids PlaySafer" class="kps-card-logo" />
				<h1 class="kps-card-title">Admin Login</h1>
				<form id="admin-form" class="kps-form">
					<input id="admin-email" type="email" class="kps-input" placeholder="Email" autocomplete="email" required />
					<input id="admin-password" type="password" class="kps-input" placeholder="Password" autocomplete="current-password" required />
					<p id="admin-error" class="kps-error" hidden></p>
					<button type="submit" class="kps-btn kps-btn-primary">Sign In</button>
					<a href="#" id="forgot-link" class="kps-link">Forgot password?</a>
					<p id="forgot-status" class="kps-info" hidden></p>
				</form>
			</div>
		</section>
		<script type="module" src="/js/pages/admin/index.js"></script>
	</body>
</html>
